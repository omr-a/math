name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends shellcheck wireguard-tools unbound qrencode
      - name: Lint
        run: shellcheck -x vpn install.sh uninstall.sh tests/run.sh
      - name: Test
        run: sudo tests/run.sh
